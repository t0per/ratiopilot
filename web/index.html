<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RatioPilot</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/uplot.min.css">
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
<script defer src="vendor/uplot.min.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="app" x-init="boot()" :class="{ 'is-running': snap.running }">

<!-- ============ connexion ============ -->
<template x-if="view === 'login'">
  <main class="login">
    <form class="login-card" @submit.prevent="login()">
      <div class="brand brand-lg"><span class="brand-mark" aria-hidden="true"></span>RatioPilot</div>
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" x-model="loginForm.password" autocomplete="current-password" autofocus required>
      <label class="check"><input type="checkbox" x-model="loginForm.remember"> Rester connecté 30 jours</label>
      <p class="form-error" x-show="loginForm.error" x-text="loginForm.error"></p>
      <button class="btn btn-primary" type="submit" :disabled="loginForm.busy">Se connecter</button>
    </form>
  </main>
</template>

<!-- ============ application ============ -->
<template x-if="view === 'app'">
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>RatioPilot</div>
    <div class="topbar-meta">
      <span class="conn" :class="connected ? 'conn-ok' : 'conn-ko'" :title="connected ? 'Mise à jour en direct' : 'Connexion perdue, nouvelle tentative…'"></span>
      <span class="meta-item" x-text="clientLabel(snap.client)"></span>
      <span class="meta-item" :title="snap.portOpen ? 'Port ouvert localement' : 'Port annoncé (non ouvert)'">port <b x-text="snap.port"></b></span>
    </div>
    <div class="topbar-actions">
      <button class="btn" :class="snap.running ? 'btn-stop' : 'btn-primary'" @click="toggleRun()" :disabled="busy.run">
        <span x-text="snap.running ? 'Arrêter le seed' : 'Démarrer le seed'"></span>
      </button>
      <button class="icon-btn" @click="toggleTheme()" :title="theme === 'dark' ? 'Thème clair' : 'Thème sombre'" aria-label="Changer de thème">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
      <button class="icon-btn" x-show="authEnabled" @click="logout()" title="Se déconnecter" aria-label="Se déconnecter">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 4H5v16h5v-2H7V6h3V4Zm6.6 3.4-1.4 1.4 2.2 2.2H9v2h8.4l-2.2 2.2 1.4 1.4L21.2 12l-4.6-4.6Z"/></svg>
      </button>
    </div>
  </header>

  <!-- instrument principal -->
  <section class="instrument" aria-label="Débit en direct">
    <div class="readout">
      <div class="readout-value">
        <span class="digits" x-text="speedParts(snap.speed)[0]"></span>
        <span class="unit" x-text="speedParts(snap.speed)[1]"></span>
      </div>
      <p class="readout-caption" x-show="snap.running && snap.globalRate > 0 && snap.speed === 0">
        Aucun leecher sur les torrents actifs : rien n'est envoyé, comme le ferait un vrai client.
      </p>
      <p class="readout-caption" x-show="snap.running && snap.speed > 0">
        Débit tiré au sort : <b x-text="fmtSpeed(snap.globalRate)"></b>, nouveau tirage dans <b x-text="countdown(snap.nextRefresh)"></b>
      </p>
      <p class="readout-caption" x-show="!snap.running">Seed à l'arrêt.</p>
      <dl class="gauges">
        <div><dt>Envoyé (session)</dt><dd x-text="fmtBytes(snap.sessionUp)"></dd></div>
        <div><dt>Envoyé (cumul)</dt><dd x-text="fmtBytes(snap.totalUp)"></dd></div>
        <div><dt>Torrents actifs</dt><dd><span x-text="snap.active"></span><small> / <span x-text="config.simultaneousSeed"></span></small></dd></div>
        <div><dt>En ligne depuis</dt><dd x-text="snap.running ? duration(snap.now - snap.startedAt) : '—'"></dd></div>
      </dl>
    </div>
    <div class="chart-wrap">
      <div id="chart" x-init="$nextTick(() => initChart($el))"></div>
      <p class="chart-empty" x-show="history.length < 2">Le graphique se remplit dès que le seed tourne (une mesure toutes les 5 s, sur une heure).</p>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" :aria-selected="tab === 'torrents'" @click="tab = 'torrents'">Torrents <span class="count" x-text="snap.torrents.length"></span></button>
    <button role="tab" :aria-selected="tab === 'settings'" @click="tab = 'settings'">Réglages <span class="dot-dirty" x-show="settingsDirty" title="Modifications non enregistrées"></span></button>
    <button role="tab" :aria-selected="tab === 'log'" @click="tab = 'log'">Journal <span class="count count-warn" x-show="unseenErrors > 0" x-text="unseenErrors"></span></button>
  </nav>

  <!-- ============ torrents ============ -->
  <section class="panel" x-show="tab === 'torrents'">
    <div class="dropzone" :class="{ 'is-over': dragOver }"
         @dragover.prevent="dragOver = true" @dragleave.prevent="dragOver = false" @drop.prevent="dropFiles($event)">
      <p>Glisse tes fichiers <b>.torrent</b> ici, ou</p>
      <label class="btn btn-ghost">Choisir des fichiers<input type="file" accept=".torrent,application/x-bittorrent" multiple @change="pickFiles($event)" hidden></label>
      <p class="hint">Tu peux aussi les déposer dans le dossier <code>data/torrents</code> : ils sont détectés en quelques secondes.</p>
    </div>

    <div class="toolbar" x-show="snap.torrents.length">
      <input class="search" type="search" placeholder="Filtrer par nom ou tracker" x-model="filter.q" aria-label="Filtrer">
      <div class="chips" role="group" aria-label="Filtrer par état">
        <template x-for="f in statusFilters" :key="f.id">
          <button class="chip" :class="{ on: filter.status === f.id }" @click="filter.status = f.id">
            <span x-text="f.label"></span> <span class="chip-n" x-text="countBy(f.id)"></span>
          </button>
        </template>
      </div>
    </div>

    <p class="empty" x-show="!snap.torrents.length">Aucun torrent pour l'instant. Ajoute un fichier .torrent pour commencer.</p>

    <div class="table" x-show="snap.torrents.length" role="table">
      <div class="tr th" role="row">
        <span role="columnheader">Torrent</span><span role="columnheader">État</span><span role="columnheader" class="num">Pairs</span>
        <span role="columnheader">Débit</span><span role="columnheader" class="num">Envoyé</span><span role="columnheader" class="num">Ratio</span>
        <span role="columnheader" class="num">Annonce</span><span role="columnheader"></span>
      </div>
      <template x-for="t in visibleTorrents()" :key="t.hash">
        <div class="trow" :class="'st-' + t.status">
          <div class="tr" role="row" @click="toggleOpen(t.hash)">
            <span class="cell-name" role="cell">
              <b x-text="t.name" :title="t.name"></b>
              <small><span x-text="t.tracker"></span><template x-if="t.private"><span class="tag">privé</span></template><span x-text="fmtBytes(t.size)"></span></small>
            </span>
            <span role="cell"><span class="pill" x-text="statusLabel(t.status)"></span></span>
            <span role="cell" class="num" data-label="Pairs" :title="t.seeders + ' seeders, ' + t.leechers + ' leechers'"><span x-text="t.lastAnnounce ? t.seeders : '–'"></span> <small>S</small> <span x-text="t.lastAnnounce ? t.leechers : '–'"></span> <small>L</small></span>
            <span role="cell" class="cell-speed" data-label="Débit">
              <span x-text="t.speed > 0 ? fmtSpeed(t.speed) : '—'"></span>
              <span class="share" aria-hidden="true"><i :style="'width:' + Math.round(t.share * 100) + '%'"></i></span>
            </span>
            <span role="cell" class="num" data-label="Envoyé" x-text="fmtBytes(t.sessionUp)"></span>
            <span role="cell" class="num" data-label="Ratio" x-text="t.ratio.toFixed(t.ratio > 0 && t.ratio < 0.01 ? 3 : 2).replace('.', ',')"></span>
            <span role="cell" class="num" data-label="Prochaine annonce" x-text="t.nextAnnounce ? countdown(t.nextAnnounce) : '—'"></span>
            <span role="cell" class="cell-actions" @click.stop>
              <template x-if="['done','error','nopeers'].includes(t.status)">
                <button class="icon-btn" title="Réactiver" @click="act(t, 'reset')"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg></button>
              </template>
              <template x-if="t.paused">
                <button class="icon-btn" title="Reprendre" @click="act(t, 'resume')"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
              </template>
              <template x-if="!t.paused">
                <button class="icon-btn" title="Mettre en pause" @click="act(t, 'pause')"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
              </template>
              <button class="icon-btn" title="Annoncer maintenant" :disabled="!['seeding','retrying'].includes(t.status)" @click="act(t, 'announce')"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 11v2h3l5 5V6L6 11H3Zm13.5 1A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4Z"/></svg></button>
              <button class="icon-btn icon-danger" title="Supprimer" @click="remove(t)"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Z"/></svg></button>
            </span>
          </div>
          <div class="detail" x-show="open[t.hash]">
            <dl>
              <div><dt>Info hash</dt><dd><code x-text="t.hash"></code></dd></div>
              <div><dt>Envoyé (cumul)</dt><dd x-text="fmtBytes(t.totalUp)"></dd></div>
              <div><dt>Part du débit</dt><dd x-text="Math.round(t.share * 100) + ' %'"></dd></div>
              <div><dt>Intervalle tracker</dt><dd x-text="t.interval ? duration(t.interval) : '—'"></dd></div>
              <div><dt>Dernière annonce</dt><dd x-text="t.lastAnnounce ? ago(t.lastAnnounce) : 'jamais'"></dd></div>
              <div><dt>Ajouté</dt><dd x-text="new Date(t.addedAt * 1000).toLocaleString('fr-FR')"></dd></div>
            </dl>
            <p class="detail-error" x-show="t.lastError"><b>Dernière erreur :</b> <span x-text="t.lastError"></span> <small x-show="t.failures" x-text="'(' + t.failures + ' échec(s) de suite)'"></small></p>
            <p class="detail-warn" x-show="t.warning"><b>Message du tracker :</b> <span x-text="t.warning"></span></p>
            <p class="detail-trackers"><b>Trackers :</b> <template x-for="u in t.trackers"><code x-text="u"></code></template></p>
          </div>
        </div>
      </template>
    </div>
  </section>

  <!-- ============ réglages ============ -->
  <section class="panel" x-show="tab === 'settings'">
    <form class="settings" @submit.prevent="saveSettings()" @input="settingsDirty = true">
      <fieldset>
        <legend>Client émulé</legend>
        <p class="help">Le logiciel BitTorrent que RatioPilot imite auprès des trackers (identifiant, format des requêtes, en-têtes). Choisis-en un accepté par ton tracker.</p>
        <label for="s-client">Client</label>
        <select id="s-client" x-model="form.client">
          <template x-for="g in clientGroups()" :key="g.name">
            <optgroup :label="g.name">
              <template x-for="c in g.items" :key="c"><option :value="c" x-text="clientLabel(c)" :selected="c === form.client"></option></template>
            </optgroup>
          </template>
        </select>
      </fieldset>

      <fieldset>
        <legend>Débit simulé</legend>
        <p class="help">Un débit global est tiré au hasard entre ces deux valeurs, puis réparti entre les torrents selon leur nombre de leechers.</p>
        <div class="row2">
          <div><label for="s-min">Minimum (ko/s)</label><input id="s-min" type="number" min="0" step="1" x-model.number="form.minUploadRate"></div>
          <div><label for="s-max">Maximum (ko/s)</label><input id="s-max" type="number" min="0" step="1" x-model.number="form.maxUploadRate"></div>
        </div>
        <div class="presets" role="group" aria-label="Préréglages">
          <template x-for="p in presets" :key="p.label">
            <button type="button" class="chip" @click="form.minUploadRate = p.min; form.maxUploadRate = p.max; settingsDirty = true">
              <span x-text="p.label"></span> <span class="chip-n" x-text="p.min + '–' + p.max"></span>
            </button>
          </template>
        </div>
        <label for="s-refresh">Nouveau tirage du débit toutes les (minutes)</label>
        <input id="s-refresh" type="number" min="1" max="1440" x-model.number="form.speedRefreshMinutes">
      </fieldset>

      <fieldset>
        <legend>Rotation des torrents</legend>
        <label for="s-sim">Torrents annoncés en même temps</label>
        <input id="s-sim" type="number" min="1" max="1000" x-model.number="form.simultaneousSeed">
        <p class="help">Les autres attendent leur tour et prennent la place d'un torrent qui s'arrête.</p>

        <label class="check"><input type="checkbox" :checked="form.uploadRatioTarget > 0" @change="form.uploadRatioTarget = $event.target.checked ? 2 : -1"> Arrêter un torrent quand il atteint un ratio cible</label>
        <div x-show="form.uploadRatioTarget > 0" class="indent">
          <label for="s-ratio">Ratio cible (sur la session)</label>
          <input id="s-ratio" type="number" min="0.1" step="0.1" x-model.number="form.uploadRatioTarget">
        </div>

        <label class="check"><input type="checkbox" x-model="form.keepTorrentWithZeroLeechers"> Garder les torrents sans aucun pair</label>
        <p class="help">Décoché : un torrent sans seeder ni leecher quitte la rotation pour laisser sa place.</p>
      </fieldset>

      <fieldset>
        <legend>Réseau et démarrage</legend>
        <div class="row2">
          <div><label for="s-port">Port annoncé</label><input id="s-port" type="number" min="1" max="65535" x-model.number="form.port"></div>
          <div><label for="s-fail">Échecs avant mise en erreur</label><input id="s-fail" type="number" min="1" max="100" x-model.number="form.maxFailures"></div>
        </div>
        <label class="check"><input type="checkbox" x-model="form.autoStart"> Démarrer le seed au lancement du conteneur</label>
        <p class="help">Changer de client ou de port redémarre le seed (annonce « stopped » puis « started »).</p>
      </fieldset>

      <div class="settings-bar">
        <p class="form-error" x-show="settingsError" x-text="settingsError"></p>
        <button type="button" class="btn btn-ghost" @click="resetSettings()" :disabled="!settingsDirty">Annuler</button>
        <button type="submit" class="btn btn-primary" :disabled="!settingsDirty || busy.save">Enregistrer</button>
      </div>
    </form>
  </section>

  <!-- ============ journal ============ -->
  <section class="panel" x-show="tab === 'log'" x-effect="if (tab === 'log') unseenErrors = 0">
    <div class="toolbar">
      <div class="chips" role="group" aria-label="Filtrer le journal">
        <template x-for="l in logLevels" :key="l.id">
          <button class="chip" :class="{ on: logFilter === l.id }" @click="logFilter = l.id" x-text="l.label"></button>
        </template>
      </div>
    </div>
    <p class="empty" x-show="!filteredEvents().length">Rien à afficher.</p>
    <ol class="log">
      <template x-for="ev in filteredEvents()" :key="ev.id">
        <li :class="'lv-' + ev.level">
          <time x-text="clock(ev.t)"></time>
          <span class="log-torrent" x-show="ev.torrent" x-text="ev.torrent"></span>
          <span x-text="ev.msg"></span>
        </li>
      </template>
    </ol>
  </section>

  <footer class="foot">RatioPilot <span x-text="version"></span>. Émulation compatible avec les fichiers .client de JOAL</footer>
</div>
</template>

<div class="toasts" aria-live="polite">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="'toast-' + t.kind" x-text="t.msg"></div>
  </template>
</div>
</body>
</html>
